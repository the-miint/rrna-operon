name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The pipeline depends on the `miint` DuckDB extension. CI installs a stock
# DuckDB build from the official release archive, then pulls `miint` from
# the microbio.me extension repository (unsigned, allowed via -unsigned).
env:
  # DuckDB CLI version — used for the cache key here and pinned identically in
  # install.sh (which performs the actual DuckDB + miint install). Must match
  # the version the miint extension was built against; bump in lockstep with
  # install.sh and CLAUDE.md when a new miint release ships.
  DUCKDB_VERSION: v1.5.3

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out rrna-operon
        uses: actions/checkout@v4

      - name: Cache DuckDB binary and miint extension
        id: duckdb-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.duckdb-bin
            ~/.duckdb/extensions
          key: duckdb-${{ env.DUCKDB_VERSION }}-miint-${{ runner.os }}-v1

      - name: Install DuckDB + miint via install.sh
        if: steps.duckdb-cache.outputs.cache-hit != 'true'
        run: |
          # Exercise the user-facing installer. --no-barrnap skips the heavy
          # conda/Infernal annotation deps the test suite does not use; the
          # DuckDB-CLI download + miint INSTALL/LOAD path is covered.
          DUCKDB_DEST="${GITHUB_WORKSPACE}/.duckdb-bin" ./install.sh --no-barrnap
          "${GITHUB_WORKSPACE}/.duckdb-bin/duckdb" --version

      - name: Verify miint extension loads
        run: |
          "${GITHUB_WORKSPACE}/.duckdb-bin/duckdb" -unsigned \
            -c "LOAD miint; SELECT count(*) FROM duckdb_functions() WHERE function_name LIKE 'align_%' OR function_name LIKE 'extract_linked_%';"

      - name: Run test suite
        run: |
          DUCKDB="${GITHUB_WORKSPACE}/.duckdb-bin/duckdb" \
            ./test/run_tests.sh

      - name: Smoke-test retained-table export
        run: |
          DUCKDB="${GITHUB_WORKSPACE}/.duckdb-bin/duckdb"
          "$DUCKDB" -unsigned -cmd "LOAD miint;" test/workdir/test.duckdb <<'SQL'
          COPY umi_ref         TO 'test/workdir/umi_ref.parquet'         (FORMAT PARQUET, COMPRESSION 'zstd');
          COPY bin_pass        TO 'test/workdir/bin_pass.parquet'        (FORMAT PARQUET, COMPRESSION 'zstd');
          COPY cluster_members TO 'test/workdir/cluster_members.parquet' (FORMAT PARQUET, COMPRESSION 'zstd');
          SQL
          for f in umi_ref bin_pass cluster_members; do
              test -s "test/workdir/${f}.parquet" || { echo "Missing/empty: ${f}.parquet" >&2; exit 1; }
          done
